[project]
name = "flowdesk"
version = "0.1.0"
description = "Flow cytometry analysis workspace: gating, compensation, layouts and tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flowdesk = "flowdesk.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
