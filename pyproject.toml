[project]
name = "flowdesk"
version = "0.2.1"
description = "Flow cytometry analysis workspace: gating, compensation, layouts and tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "contourpy>=1.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mcp>=1.10"]
agent = ["mcp>=1.10"]
analysis = ["scikit-learn>=1.3", "openTSNE>=1.0", "umap-learn>=0.5"]
packaging = ["pyinstaller>=6.10"]

[project.scripts]
flowdesk = "flowdesk.app:main"
flowdesk-mcp = "flowdesk.agent.server:main"
flowdesk-mcp-install = "flowdesk.agent.install:main"

[project.gui-scripts]
# Windows: starts without a console window (flowdesk-gui.exe in the venv's Scripts folder).
flowdesk-gui = "flowdesk.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowdesk*"]

[tool.setuptools.package-data]
"flowdesk.agent" = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a test that hangs dumps every thread's stack after two minutes instead of stalling CI silently
faulthandler_timeout = 120
