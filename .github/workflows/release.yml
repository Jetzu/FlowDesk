name: release

# Build standalone apps with PyInstaller and attach them to the GitHub release of the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual dry run: builds and uploads workflow artifacts only

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux
          - os: windows-latest
            tag: windows
          - os: macos-latest
            tag: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10"
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py --zip
      - name: Smoke test (the app must stay up for 5 s)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "${{ runner.os }}" in
            macOS)   BIN=dist/FlowDesk.app/Contents/MacOS/FlowDesk ;;
            Windows) BIN=dist/FlowDesk/FlowDesk.exe ;;
            *)       BIN=dist/FlowDesk/FlowDesk ;;
          esac
          "$BIN" & PID=$!
          sleep 5
          kill -0 "$PID"
          kill "$PID" || true
      - uses: actions/upload-artifact@v4
        with:
          name: FlowDesk-${{ matrix.tag }}
          path: dist/FlowDesk-${{ matrix.tag }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FlowDesk-*.zip
          generate_release_notes: true
