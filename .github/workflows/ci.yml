name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    env:
      # Qt renders without a display server, so no xvfb is needed on Linux.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        # The offscreen platform still loads libQt6Gui (EGL/GL, xkbcommon, fontconfig, dbus).
        # The xcb libraries are only needed for the real "xcb" platform but keep import errors away.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Entry point smoke test
        run: |
          python -m flowdesk --version
          flowdesk --help
      - name: Run tests (offscreen)
        run: python -m pytest -q -rf
